name: EHL auto sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync EHL from HockeyLive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing in GitHub Actions secrets."
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 45 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://stang-inn-xi.vercel.app/api/sync-ehl")

          echo "$response"
